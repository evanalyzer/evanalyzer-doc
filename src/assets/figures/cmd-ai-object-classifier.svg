<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
  </style>
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="439" height="239" rx="10"/>
<!-- object with its ring -->
<path d="M 62,52 A 40 40 0 1 1 62,132 A 40 40 0 1 1 62,52 Z M 62,66 A 26 26 0 1 0 62,118 A 26 26 0 1 0 62,66 Z" fill="#ea580c" fill-opacity="0.18" fill-rule="evenodd"/>
<circle cx="62" cy="92" r="40" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="62" cy="92" r="26" fill="#2563eb" fill-opacity="0.4" stroke="#2563eb" stroke-width="2"/>
<text class="lbl-sm" style="fill:#2563eb" x="62" y="96" text-anchor="middle">object</text>
<line x1="88" y1="92" x2="102" y2="92" stroke="#1f2937" stroke-width="1.5"/>
<text class="lbl-sm" style="fill:#ea580c" x="62" y="150" text-anchor="middle">ring around it</text>
<text class="lbl-sm" style="fill:#ea580c" x="62" y="163" text-anchor="middle">(ring width, 5 px)</text>
<line x1="106" y1="92" x2="124" y2="92" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a0)"/>
<!-- features -->
<rect x="128" y="46" width="176" height="92" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text class="lbl-bold" x="216" y="38" text-anchor="middle">features, as in training</text>
<text class="lbl-sm" x="138" y="66">shape: area, circularity, …</text>
<text class="lbl-sm" x="138" y="86">intensity: mean, median, …</text>
<text class="lbl-sm" style="fill:#ea580c" x="138" y="106">ring: mean of the ring,</text>
<text class="lbl-sm" style="fill:#ea580c" x="138" y="122">object mean − ring mean</text>
<line x1="306" y1="82" x2="318" y2="82" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a0)"/>
<!-- model -->
<rect x="322" y="60" width="100" height="44" rx="6" fill="#eef1f5" stroke="#4b5563" stroke-width="1.5"/>
<text class="lbl-bold" x="372" y="79" text-anchor="middle">model</text>
<text class="lbl-sm" x="372" y="94" text-anchor="middle">predicts a class</text>
<line x1="356" y1="106" x2="344" y2="124" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a0)"/>
<line x1="388" y1="106" x2="400" y2="124" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a0)"/>
<text class="lbl-sm" style="fill:#16a34a" x="340" y="140" text-anchor="middle">mapped:</text>
<text class="lbl-sm" style="fill:#16a34a" x="340" y="154" text-anchor="middle">class set</text>
<text class="lbl-sm" x="404" y="140" text-anchor="middle">unmapped:</text>
<text class="lbl-sm" x="404" y="154" text-anchor="middle">untouched</text>
<text class="lbl-bold" x="220" y="204" text-anchor="middle">AI Object Classifier</text>
<text class="lbl-sm" x="220" y="220" text-anchor="middle">each object is scored on its own features and gets the mapped class</text>
</svg>
