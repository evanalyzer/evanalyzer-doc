<rect x="146" y="58" width="142" height="98" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text class="lbl-bold" x="217" y="50" text-anchor="middle">Projection</text>
<text class="lbl-sm" x="156" y="78"><tspan font-weight="600">Auto</tspan>: as the project</text>
<text class="lbl-sm" x="156" y="100"><tspan font-weight="600">Max, Min, Avg, Sum,</tspan></text>
<text class="lbl-sm" x="156" y="114"><tspan font-weight="600">Take The Middle</tspan></text>
<text class="lbl-sm" x="156" y="136"><tspan font-weight="600">None</tspan>: the plane at</text>
<text class="lbl-sm" x="156" y="149">Z Index</text>
