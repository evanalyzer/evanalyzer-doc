<text class="lbl-sm" style="fill:#6b7280" x="22" y="60" text-anchor="middle">ch 0</text>
<rect x="40" y="86" width="44" height="30" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
<rect x="46" y="91" width="44" height="30" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
<rect x="52" y="96" width="44" height="30" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
