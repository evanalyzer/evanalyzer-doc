<rect x="40" y="136" width="44" height="30" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1"/>
<rect x="46" y="141" width="44" height="30" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1"/>
<rect x="52" y="146" width="44" height="30" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1"/>
<text class="lbl-sm" style="fill:#ea580c" x="22" y="160" text-anchor="middle">ch 2</text>
<text class="lbl-sm" x="62" y="192" text-anchor="middle">z-planes per channel</text>
<line x1="104" y1="106" x2="140" y2="106" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a0)"/>
