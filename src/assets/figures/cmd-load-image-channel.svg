  </style>
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="439" height="239" rx="10"/>
<text class="lbl-sm" x="62" y="26" text-anchor="middle">the image file</text>
<rect x="40" y="36" width="44" height="30" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="1"/>
<rect x="46" y="41" width="44" height="30" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="1"/>
