<rect x="324" y="82" width="64" height="48" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
<text class="lbl-sm" x="356" y="72" text-anchor="middle">current image</text>
<text class="lbl-sm" x="356" y="148" text-anchor="middle">objects and</text>
<text class="lbl-sm" x="356" y="161" text-anchor="middle">segmentation</text>
