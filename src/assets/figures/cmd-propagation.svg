<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
  </style>
  <defs>
    <path id="cellL" d="M90,56 C70,40 28,44 22,95 C16,140 55,160 90,152 C95,122 84,84 90,56 Z"/>
    <path id="cellR" d="M90,56 C130,40 196,60 198,102 C200,142 150,162 90,152 C95,122 84,84 90,56 Z"/>
    <path id="gap" d="M90,56 C84,84 95,122 90,152"/>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="439" height="239" rx="10"/>
<!-- left panel: growth channel and seeds -->
<text class="lbl-bold" x="110" y="24" text-anchor="middle">Growth Channel + Seeds</text>
<use href="#cellL" fill="#4b5563" fill-opacity="0.45"/>
<use href="#cellR" fill="#4b5563" fill-opacity="0.45"/>
<use href="#gap" fill="none" stroke="#f7f8fa" stroke-width="4"/>
<ellipse cx="52" cy="98" rx="14" ry="11" fill="#2563eb" fill-opacity="0.6" stroke="#2563eb" stroke-width="2"/>
<ellipse cx="160" cy="102" rx="12" ry="10" fill="#ea580c" fill-opacity="0.6" stroke="#ea580c" stroke-width="2"/>
<text class="lbl-sm" x="52" y="126" text-anchor="middle">seed</text>
<text class="lbl-sm" x="160" y="129" text-anchor="middle">seed</text>
<line x1="92" y1="166" x2="91" y2="156" stroke="#4b5563" stroke-width="1"/>
<text class="lbl-sm" x="92" y="178" text-anchor="middle">dim gap</text>
<!-- arrow -->
<path d="M206,102 L226,102" stroke="#6b7280" stroke-width="2" fill="none"/>
<path d="M226,97 L234,102 L226,107 z" fill="#6b7280"/>
<!-- right panel: grown regions -->
<text class="lbl-bold" x="335" y="24" text-anchor="middle">Regions</text>
<g transform="translate(225,0)">
  <use href="#cellL" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/>
  <use href="#cellR" fill="#ea580c" fill-opacity="0.25" stroke="#ea580c" stroke-width="2"/>
  <ellipse cx="52" cy="98" rx="14" ry="11" fill="#2563eb" fill-opacity="0.6"/>
  <ellipse cx="160" cy="102" rx="12" ry="10" fill="#ea580c" fill-opacity="0.6"/>
  <line x1="106" y1="44" x2="106" y2="160" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="lbl-sm" style="fill:#9333ea" x="120" y="174" text-anchor="start">halfway</text>
  <text class="lbl-sm" x="80" y="174" text-anchor="end">border</text>
  <line x1="82" y1="166" x2="90" y2="155" stroke="#4b5563" stroke-width="1"/>
</g>
<text class="lbl-bold" x="220" y="206" text-anchor="middle">Propagation</text>
<text class="lbl-sm" x="220" y="222" text-anchor="middle">each pixel joins the seed it reaches most cheaply: borders follow dim gaps</text>
</svg>
