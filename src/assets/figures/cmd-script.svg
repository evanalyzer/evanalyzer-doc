<text class="lbl-sm" x="125" y="22" text-anchor="middle">Source (Rhai)</text>
<text class="code" style="fill:#1f2937" x="22" y="50" xml:space="preserve">let raw = image();</text>
<text class="code" style="fill:#2563eb" x="22" y="67" xml:space="preserve">let b = run("gaussian_blur", raw);</text>
<text class="code" style="fill:#9333ea" x="22" y="101" xml:space="preserve">if b.max() &lt; 100.0 {</text>
<text class="code" style="fill:#ea580c" x="22" y="118" xml:space="preserve">  let p = #{ kernel_size: 5 };</text>
<text class="code" style="fill:#ea580c" x="22" y="135" xml:space="preserve">  b = run("gaussian_blur", raw, p);</text>
<text class="code" style="fill:#9333ea" x="22" y="152" xml:space="preserve">}</text>
<text class="code" style="fill:#16a34a" x="22" y="186" xml:space="preserve">run("threshold", b);</text>
