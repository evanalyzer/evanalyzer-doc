<rect class="bg" x="0.5" y="0.5" width="439" height="229" rx="10"/><rect x="45" y="45" width="130" height="110" rx="6" fill="url(#vignette)"/><circle cx="90" cy="90" r="5" fill="#f7f8fa" opacity="0.9"/><circle cx="130" cy="100" r="4" fill="#f7f8fa" opacity="0.75"/><circle cx="105" cy="120" r="4.5" fill="#f7f8fa" opacity="0.6"/><circle cx="145" cy="70" r="3.5" fill="#f7f8fa" opacity="0.45"/><text class="lbl-bold" x="110" y="180" text-anchor="middle">Before</text><text class="lbl-sm" x="110" y="196" text-anchor="middle">vignetting hides dim objects</text><path class="arrow" d="M195 100 L245 100" marker-end="url(#arrow)"/><text class="lbl-sm" x="220" y="90" text-anchor="middle">correct</text><rect x="265" y="45" width="130" height="110" rx="6" fill="#3b82f6"/><circle cx="305" cy="90" r="5" fill="#f7f8fa"/><circle cx="345" cy="100" r="4" fill="#f7f8fa"/><circle cx="320" cy="120" r="4.5" fill="#f7f8fa"/><circle cx="360" cy="70" r="3.5" fill="#f7f8fa"/><text class="lbl-bold" x="330" y="180" text-anchor="middle">After</text><text class="lbl-sm" x="330" y="196" text-anchor="middle">even field, objects equally visible</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4b5563"/></marker></defs></svg>
