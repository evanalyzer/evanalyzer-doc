<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .group { fill: none; stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke-width: 2; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-mono { font: 11px monospace; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
    .lbl-group { font: 12px sans-serif; font-weight: 600; fill: #6b7280; }
    .step { font: 11px sans-serif; font-weight: 700; fill: #ffffff; }
    .arrow { fill: none; stroke: #4b5563; stroke-width: 1.6; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="719" height="399" rx="10"/>
  <text class="lbl-bold" x="360" y="28" text-anchor="middle">Remote control: clients, server and workers</text>

  <!-- Client machines -->
  <rect class="group" x="16" y="48" width="208" height="300" rx="8"/>
  <text class="lbl-group" x="30" y="68">Your computer(s)</text>

  <rect class="box" x="32" y="90" width="176" height="78" rx="6" stroke="#2563eb"/>
  <text class="lbl-bold" x="120" y="112" text-anchor="middle">EVAnalyzer GUI</text>
  <text class="lbl-mono" x="120" y="132" text-anchor="middle">--remote ws://srv:7400</text>
  <text class="lbl-mono" x="120" y="148" text-anchor="middle">--user alice</text>

  <rect class="box" x="32" y="214" width="176" height="78" rx="6" stroke="#2563eb"/>
  <text class="lbl-bold" x="120" y="236" text-anchor="middle">evanalyzer cli …</text>
  <text class="lbl-mono" x="120" y="256" text-anchor="middle">--remote ws://srv:7400</text>
  <text class="lbl-mono" x="120" y="272" text-anchor="middle">--user bob</text>

  <text class="lbl-sm" x="120" y="318" text-anchor="middle">Only the user interface runs here -</text>
  <text class="lbl-sm" x="120" y="333" text-anchor="middle">no images, no computing</text>

  <!-- Server machine -->
  <rect class="group" x="262" y="48" width="442" height="300" rx="8"/>
  <text class="lbl-group" x="276" y="68">Server machine (e.g. GPU workstation)</text>

  <rect class="box" x="276" y="148" width="162" height="84" rx="6" stroke="#ea580c"/>
  <text class="lbl-bold" x="357" y="172" text-anchor="middle">evanalyzer server</text>
  <text class="lbl-mono" x="357" y="191" text-anchor="middle">port 7400</text>
  <text class="lbl-sm" x="357" y="208" text-anchor="middle">checks the login,</text>
  <text class="lbl-sm" x="357" y="222" text-anchor="middle">starts one worker per user</text>

  <rect class="box" x="490" y="84" width="196" height="64" rx="6" stroke="#16a34a"/>
  <text class="lbl-bold" x="588" y="106" text-anchor="middle">evanalyzer worker (alice)</text>
  <text class="lbl-mono" x="588" y="124" text-anchor="middle">127.0.0.1:&lt;free port&gt;</text>
  <text class="lbl-sm" x="588" y="139" text-anchor="middle">runs pipelines &amp; queries</text>

  <rect class="box" x="490" y="170" width="196" height="64" rx="6" stroke="#16a34a"/>
  <text class="lbl-bold" x="588" y="192" text-anchor="middle">evanalyzer worker (bob)</text>
  <text class="lbl-mono" x="588" y="210" text-anchor="middle">127.0.0.1:&lt;free port&gt;</text>
  <text class="lbl-sm" x="588" y="225" text-anchor="middle">runs pipelines &amp; queries</text>

  <rect class="box" x="490" y="270" width="196" height="58" rx="6" stroke="#6b7280"/>
  <text class="lbl-bold" x="588" y="292" text-anchor="middle">Files on the server</text>
  <text class="lbl-sm" x="588" y="310" text-anchor="middle">images · projects · results.evadb</text>

  <!-- 1: login -->
  <path class="arrow" d="M208 129 C 245 129, 248 172, 274 176"/>
  <path class="arrow" d="M208 253 C 245 253, 248 210, 274 206"/>
  <circle cx="246" cy="150" r="9" fill="#2563eb"/><text class="step" x="246" y="154" text-anchor="middle">1</text>
  <circle cx="246" cy="232" r="9" fill="#2563eb"/><text class="step" x="246" y="236" text-anchor="middle">1</text>

  <!-- 2: start / forward -->
  <path class="arrow" d="M438 176 C 462 176, 462 118, 488 116"/>
  <path class="arrow" d="M438 204 L 488 202"/>
  <circle cx="463" cy="146" r="9" fill="#ea580c"/><text class="step" x="463" y="150" text-anchor="middle">2</text>

  <!-- 3: files -->
  <path class="arrow" d="M686 116 H 698 V 299 H 688"/>
  <path class="arrow" d="M588 234 V 268"/>
  <circle cx="698" cy="250" r="9" fill="#16a34a"/><text class="step" x="698" y="254" text-anchor="middle">3</text>

  <!-- Legend -->
  <circle cx="30" cy="368" r="7" fill="#2563eb"/><text class="step" x="30" y="372" text-anchor="middle">1</text>
  <text class="lbl-sm" x="42" y="372">Client logs in on the server</text>
  <circle cx="222" cy="368" r="7" fill="#ea580c"/><text class="step" x="222" y="372" text-anchor="middle">2</text>
  <text class="lbl-sm" x="234" y="372">Server starts (or reattaches to) the user's worker and tunnels the connection</text>
  <circle cx="30" cy="388" r="7" fill="#16a34a"/><text class="step" x="30" y="392" text-anchor="middle">3</text>
  <text class="lbl-sm" x="42" y="392">Worker reads images and writes results directly on the server - only tiles, previews and table pages travel back</text>
</svg>
