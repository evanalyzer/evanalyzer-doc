<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-xs { font: 10px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
    .badge { font: 10px sans-serif; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="lao-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="439" height="229" rx="10"/>
<text class="lbl-bold" x="220" y="24" text-anchor="middle">Load Annotated Objects</text>

<!-- Left: image with hand-drawn annotations -->
<rect x="20" y="40" width="160" height="130" rx="4" fill="#1f2937"/>
<circle cx="45" cy="60" r="2" fill="#67e8f9"/><circle cx="160" cy="70" r="2" fill="#67e8f9"/><circle cx="120" cy="150" r="2" fill="#67e8f9"/><circle cx="70" cy="155" r="2" fill="#67e8f9"/><circle cx="150" cy="120" r="2" fill="#67e8f9"/>
<rect x="34" y="56" width="58" height="42" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>
<ellipse cx="135" cy="92" rx="30" ry="22" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M 48 118 L 86 110 L 104 136 L 82 160 L 50 150 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>
<text class="lbl-sm" x="100" y="188" text-anchor="middle">drawn by hand,</text>
<text class="lbl-sm" x="100" y="202" text-anchor="middle">stored in the project</text>

<!-- Arrow -->
<path d="M 190 105 H 248" fill="none" stroke="#4b5563" stroke-width="1.6" marker-end="url(#lao-head)"/>
<text class="lbl-xs" x="219" y="96" text-anchor="middle">pipeline</text>

<!-- Right: pipeline objects -->
<rect x="260" y="40" width="160" height="130" rx="4" fill="#1f2937"/>
<rect x="274" y="56" width="58" height="42" fill="#2563eb" fill-opacity="0.55" stroke="#60a5fa" stroke-width="2"/>
<ellipse cx="375" cy="92" rx="30" ry="22" fill="#2563eb" fill-opacity="0.55" stroke="#60a5fa" stroke-width="2"/>
<path d="M 288 118 L 326 110 L 344 136 L 322 160 L 290 150 Z" fill="#2563eb" fill-opacity="0.55" stroke="#60a5fa" stroke-width="2"/>
<rect x="287" y="68" width="34" height="15" rx="7" fill="#ea580c"/><text class="badge" x="304" y="79" text-anchor="middle">#101</text>
<rect x="358" y="85" width="34" height="15" rx="7" fill="#ea580c"/><text class="badge" x="375" y="96" text-anchor="middle">#102</text>
<rect x="299" y="129" width="34" height="15" rx="7" fill="#ea580c"/><text class="badge" x="316" y="140" text-anchor="middle">#103</text>
<text class="lbl-sm" x="340" y="188" text-anchor="middle">new ID + output class,</text>
<text class="lbl-sm" x="340" y="202" text-anchor="middle">intensities measured</text>
<text class="lbl-sm" x="340" y="216" text-anchor="middle">on every channel</text>
</svg>
