<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .edge { stroke: #d8dce1; stroke-width: 1; }
    .edge-a { stroke: #93c5fd; stroke-width: 1.6; }
    .edge-b { stroke: #e5e7eb; stroke-width: 1; }
    .node { fill: #eef1f5; stroke: #6b7280; stroke-width: 1.6; }
    .outA { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; }
    .outB { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
    .lbl-tiny { font: 9px sans-serif; fill: #4b5563; }
    .lbl-white { font: 11px sans-serif; font-weight: 600; fill: #ffffff; }
    .lbl-gray { font: 11px sans-serif; font-weight: 600; fill: #6b7280; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="579" height="269" rx="10"/>

  <text class="lbl-sm" x="290" y="15" text-anchor="middle">Forward pass &#8594;</text>

  <!-- input -> hidden1 -->
  <path class="edge" d="M70,70 L220,45"/>
  <path class="edge" d="M70,70 L220,100"/>
  <path class="edge" d="M70,70 L220,155"/>
  <path class="edge" d="M70,70 L220,210"/>
  <path class="edge" d="M70,130 L220,45"/>
  <path class="edge" d="M70,130 L220,100"/>
  <path class="edge" d="M70,130 L220,155"/>
  <path class="edge" d="M70,130 L220,210"/>
  <path class="edge" d="M70,190 L220,45"/>
  <path class="edge" d="M70,190 L220,100"/>
  <path class="edge" d="M70,190 L220,155"/>
  <path class="edge" d="M70,190 L220,210"/>

  <!-- hidden1 -> hidden2 -->
  <path class="edge" d="M220,45 L360,70"/>
  <path class="edge" d="M220,45 L360,130"/>
  <path class="edge" d="M220,45 L360,190"/>
  <path class="edge" d="M220,100 L360,70"/>
  <path class="edge" d="M220,100 L360,130"/>
  <path class="edge" d="M220,100 L360,190"/>
  <path class="edge" d="M220,155 L360,70"/>
  <path class="edge" d="M220,155 L360,130"/>
  <path class="edge" d="M220,155 L360,190"/>
  <path class="edge" d="M220,210 L360,70"/>
  <path class="edge" d="M220,210 L360,130"/>
  <path class="edge" d="M220,210 L360,190"/>

  <!-- hidden2 -> output -->
  <path class="edge-a" d="M360,70 L490,100"/>
  <path class="edge-a" d="M360,130 L490,100"/>
  <path class="edge-a" d="M360,190 L490,100"/>
  <path class="edge-b" d="M360,70 L490,160"/>
  <path class="edge-b" d="M360,130 L490,160"/>
  <path class="edge-b" d="M360,190 L490,160"/>

  <!-- input nodes -->
  <circle class="node" cx="70" cy="70" r="9"/>
  <circle class="node" cx="70" cy="130" r="9"/>
  <circle class="node" cx="70" cy="190" r="9"/>

  <!-- hidden layer 1 -->
  <circle class="node" cx="220" cy="45" r="9"/>
  <circle class="node" cx="220" cy="100" r="9"/>
  <circle class="node" cx="220" cy="155" r="9"/>
  <circle class="node" cx="220" cy="210" r="9"/>

  <!-- hidden layer 2 -->
  <circle class="node" cx="360" cy="70" r="9"/>
  <circle class="node" cx="360" cy="130" r="9"/>
  <circle class="node" cx="360" cy="190" r="9"/>

  <!-- output -->
  <circle class="outA" cx="490" cy="100" r="13"/>
  <text class="lbl-white" x="490" y="104" text-anchor="middle">A</text>
  <circle class="outB" cx="490" cy="160" r="11" opacity="0.7"/>
  <text class="lbl-gray" x="490" y="164" text-anchor="middle">B</text>

  <text class="lbl-bold" x="508" y="104" fill="#2563eb">Class A</text>
  <text class="lbl-sm" x="508" y="164" opacity="0.7">Class B</text>

  <text class="lbl-sm" x="70" y="235" text-anchor="middle">Input</text>
  <text class="lbl-sm" x="220" y="235" text-anchor="middle">Hidden 1</text>
  <text class="lbl-sm" x="360" y="235" text-anchor="middle">Hidden 2</text>
  <text class="lbl-sm" x="490" y="235" text-anchor="middle">Output</text>

  <text class="lbl-sm" x="290" y="255" text-anchor="middle">Every connection has a learned weight; layers apply ReLU between them.</text>
</svg>
