<svg xmlns="http://www.w3.org/2000/svg" width="440" height="256" viewBox="0 0 440 256">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="439" height="255" rx="10"/>
<circle cx="110" cy="95" r="48" fill="#c8d8fa" stroke="#2563eb" stroke-width="2.5"/>
<text class="lbl-bold" x="110.0" y="168.0" text-anchor="middle">circle</text>
<text class="lbl-sm" x="110.0" y="186.0" text-anchor="middle">roundness = 1.00</text>
<text class="lbl-sm" x="110.0" y="200.0" text-anchor="middle">compactness = 12.6</text>
<rect x="250.0" y="75.0" width="160" height="40" fill="#fad5c2" stroke="#ea580c" stroke-width="2.5"/>
<text class="lbl-bold" x="330.0" y="168.0" text-anchor="middle">4 : 1 rectangle</text>
<text class="lbl-sm" x="330.0" y="186.0" text-anchor="middle">roundness = 0.50</text>
<text class="lbl-sm" x="330.0" y="200.0" text-anchor="middle">compactness = 25.0</text>
<text class="lbl-bold" x="220" y="226" text-anchor="middle">Roundness = 4πA / P²   ·   Compactness = P² / A</text>
<text class="lbl-sm" x="220" y="242" text-anchor="middle">the same property from both ends: compactness = 4π / roundness</text>
</svg>
