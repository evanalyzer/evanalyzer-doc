<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
  </style>
<rect class="bg" x="0.5" y="0.5" width="439" height="249" rx="10"/>
<!-- object: a Y-shaped neurite -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M70,170 L200,110 L330,60 M200,110 L320,170" stroke="#2563eb" stroke-width="34" stroke-opacity="0.3"/>
<path d="M140,138 L150,165" stroke="#2563eb" stroke-width="16" stroke-opacity="0.3"/>
<!-- skeleton -->
<path d="M70,170 L200,110 L330,60 M200,110 L320,170" stroke="#1f2937" stroke-width="2.5"/>
<!-- pruned spur -->
<path d="M135,140 L150,168" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3"/>
</g>
<!-- points -->
<g fill="#16a34a"><circle cx="70" cy="170" r="5"/><circle cx="330" cy="60" r="5"/><circle cx="320" cy="170" r="5"/></g>
<circle cx="200" cy="110" r="6" fill="#ea580c"/>
<text class="lbl-sm" style="fill:#16a34a" x="350" y="64">end point</text>
<text class="lbl-sm" style="fill:#16a34a" x="340" y="174">end point</text>
<text class="lbl-sm" style="fill:#16a34a" x="70" y="196" text-anchor="middle">end point</text>
<text class="lbl-sm" style="fill:#ea580c" x="200" y="82" text-anchor="middle">branch point</text>
<text class="lbl-sm" x="160" y="196">spur &lt; Min Branch Length: pruned</text>
<line x1="170" y1="186" x2="152" y2="170" stroke="#4b5563" stroke-width="1"/>
<text class="lbl-sm" style="fill:#2563eb" x="40" y="40">input object</text>
<text class="lbl-sm" x="40" y="54">skeleton (1 px wide)</text>
<text class="lbl-bold" x="220" y="222" text-anchor="middle">Skeletonize Objects</text>
<text class="lbl-sm" x="220" y="238" text-anchor="middle">thinning · one pixel wide · pruning · points</text>
</svg>
