<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
  </style>
<rect class="bg" x="0.5" y="0.5" width="439" height="249" rx="10"/>
<!-- grown by Distance -->
<circle cx="170" cy="112" r="48" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
<text class="lbl-sm" style="fill:#2563eb" x="170" y="56" text-anchor="middle">grown by Distance</text>
<!-- measured object -->
<circle cx="170" cy="112" r="34" fill="#2563eb" fill-opacity="0.3" stroke="#2563eb" stroke-width="2"/>
<!-- neighbours -->
<circle cx="232" cy="80" r="24" fill="#ea580c" fill-opacity="0.3" stroke="#ea580c" stroke-width="2"/>
<circle cx="150" cy="172" r="18" fill="#ea580c" fill-opacity="0.3" stroke="#ea580c" stroke-width="2"/>
<text class="lbl-sm" style="fill:#ea580c" x="262" y="44" text-anchor="middle">neighbour</text>
<text class="lbl-sm" style="fill:#ea580c" x="96" y="200" text-anchor="middle">neighbour</text>
<!-- not a neighbour -->
<circle cx="345" cy="150" r="20" fill="#6b7280" fill-opacity="0.25" stroke="#6b7280" stroke-width="2"/>
<text class="lbl-sm" x="345" y="186" text-anchor="middle">not a neighbour</text>
<!-- touching outline -->
<path d="M185.8,81.9 A34,34 0 0 1 203.7,116.6" fill="none" stroke="#16a34a" stroke-width="5"/>
<path d="M179.7,144.6 A34,34 0 0 1 142.7,132.3" fill="none" stroke="#16a34a" stroke-width="5"/>
<text class="lbl-sm" style="fill:#16a34a" x="62" y="96" text-anchor="middle">touching</text>
<text class="lbl-sm" style="fill:#16a34a" x="62" y="110" text-anchor="middle">outline</text>
<line x1="86" y1="112" x2="140" y2="128" stroke="#16a34a" stroke-width="1"/>
<!-- closest objects, centre to centre -->
<line x1="170" y1="112" x2="150" y2="172" stroke="#1f2937" stroke-width="1.5"/>
<line x1="170" y1="112" x2="232" y2="80" stroke="#1f2937" stroke-width="1.5"/>
<g fill="#1f2937"><circle cx="170" cy="112" r="2.5"/><circle cx="150" cy="172" r="2.5"/><circle cx="232" cy="80" r="2.5"/><circle cx="345" cy="150" r="2.5"/></g>
<path d="M186.0,103.7 A18,18 0 0 1 164.3,129.1" fill="none" stroke="#9333ea" stroke-width="1.5"/>
<text class="lbl-bold" style="fill:#9333ea" x="190" y="134">θ</text>
<text class="lbl-sm" x="174" y="200">1st closest</text>
<line x1="172" y1="192" x2="158" y2="180" stroke="#4b5563" stroke-width="1"/>
<text class="lbl-sm" x="268" y="104">2nd closest</text>
<line x1="266" y1="100" x2="252" y2="92" stroke="#4b5563" stroke-width="1"/>
<text class="lbl-bold" x="220" y="222" text-anchor="middle">Measure Object Neighbors</text>
<text class="lbl-sm" x="220" y="238" text-anchor="middle">2 neighbours · closest objects by centre distance · θ between them</text>
</svg>
