<svg xmlns="http://www.w3.org/2000/svg" width="440" height="250" viewBox="0 0 440 250">
  <style>
    .bg { fill: #f7f8fa; stroke: #d8dce1; stroke-width: 1; }
    .lbl { font: 13px sans-serif; fill: #1f2937; }
    .lbl-sm { font: 11px sans-serif; fill: #4b5563; }
    .lbl-bold { font: 13px sans-serif; font-weight: 600; fill: #1f2937; }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/></marker>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="439" height="249" rx="10"/>
<!-- legend -->
<circle cx="22" cy="22" r="6" fill="#4b5563" fill-opacity="0.35" stroke="#4b5563" stroke-width="1.5"/><text class="lbl-sm" x="33" y="26">frames up to t</text>
<circle cx="132" cy="22" r="6" fill="none" stroke="#4b5563" stroke-width="2"/><text class="lbl-sm" x="143" y="26">frame t + 1</text>
<path d="M225,16 l12,12 M237,16 l-12,12" stroke="#2563eb" stroke-width="2"/><text class="lbl-sm" x="244" y="26">predicted position</text>
<line x1="290" y1="45" x2="290" y2="215" stroke="#d8dce1" stroke-width="1"/>
<!-- left: a running track -->
<circle cx="40" cy="180" r="9" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-opacity="0.45" stroke-width="2"/>
<circle cx="90" cy="155" r="9" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-opacity="0.7" stroke-width="2"/>
<circle cx="140" cy="130" r="9" fill="#2563eb" fill-opacity="0.35" stroke="#2563eb" stroke-width="2"/>
<line x1="49" y1="176" x2="81" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.6"/>
<line x1="99" y1="151" x2="131" y2="135" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.8"/>
<line x1="149" y1="126" x2="182" y2="110" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a1)"/>
<text class="lbl-sm" x="140" y="155" text-anchor="middle">t</text>
<text class="lbl-sm" x="128" y="105" text-anchor="end">velocity</text>
<!-- prediction and Max Distance around it -->
<circle cx="190" cy="105" r="36" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M184,99 l12,12 M196,99 l-12,12" stroke="#2563eb" stroke-width="2"/>
<text class="lbl-sm" style="fill:#2563eb" x="190" y="58" text-anchor="middle">Max Distance</text>
<!-- linked object near the prediction -->
<circle cx="206" cy="92" r="9" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text class="lbl-sm" x="220" y="82">linked</text>
<!-- object closer to the last position, but far from the prediction -->
<circle cx="150" cy="172" r="9" fill="none" stroke="#6b7280" stroke-width="2.5"/>
<text class="lbl-sm" x="164" y="172">nearer to t, but</text>
<text class="lbl-sm" x="164" y="185">far from the prediction</text>
<text class="lbl-sm" x="145" y="215" text-anchor="middle">the track is extended where it is heading,</text>
<text class="lbl-sm" x="145" y="230" text-anchor="middle">not where it was</text>
<!-- right: a new track -->
<text class="lbl-bold" x="365" y="62" text-anchor="middle">New track</text>
<circle cx="350" cy="140" r="52" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="350" cy="140" r="9" fill="#16a34a" fill-opacity="0.35" stroke="#16a34a" stroke-width="2"/>
<line x1="358" y1="134" x2="368" y2="126" stroke="#16a34a" stroke-width="2" marker-end="url(#a3)"/>
<circle cx="377" cy="120" r="9" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<text class="lbl-sm" style="fill:#16a34a" x="350" y="207" text-anchor="middle">Initial Max Distance</text>
<text class="lbl-sm" x="365" y="230" text-anchor="middle">no velocity yet</text>
</svg>
